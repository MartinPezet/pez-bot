# Test, build and push the runner image.
#
# - push to main: test, build linux/amd64, push :<sha> and :latest
# - pull request: test and build only (no push)
# - weekly: rebuild to pick up base-image security fixes, push :<sha> and :latest
# - manual (Actions tab, or `gh workflow run image.yml -f arm64=true`): optional arm64, optional push
#
# Secrets: REGISTRY_URL (host, optionally with a namespace, e.g. registry.example.com/martin),
# REGISTRY_USERNAME, REGISTRY_PASSWORD. The image is pushed as $REGISTRY_URL/pez-bot.
# The image is project-agnostic: TARGET_REPO is left empty and set at runtime in .env.
name: image

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      arm64:
        description: Also build linux/arm64
        type: boolean
        default: false
      push:
        description: Push to the registry
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decide platforms, push and tags
        id: meta
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          EVENT: ${{ github.event_name }}
          INPUT_ARM64: ${{ inputs.arm64 }}
          INPUT_PUSH: ${{ inputs.push }}
        run: |
          push=false
          case "$EVENT" in
            push|schedule) push=true ;;
            workflow_dispatch) [ "$INPUT_PUSH" = "true" ] && push=true ;;
          esac
          platforms=linux/amd64
          [ "$INPUT_ARM64" = "true" ] && platforms=linux/amd64,linux/arm64

          if [ "$push" = "true" ]; then
            if [ -z "$REGISTRY_URL" ]; then
              echo "::error::REGISTRY_URL secret is not set"
              exit 1
            fi
            base=$(printf '%s' "$REGISTRY_URL" | sed -E 's#^[a-z]+://##; s#/+$##')
            image="$base/pez-bot"
            tags="$image:$GITHUB_SHA,$image:latest"
            echo "host=${base%%/*}" >> "$GITHUB_OUTPUT"
          else
            tags="pez-bot:ci"
          fi
          echo "push=$push" >> "$GITHUB_OUTPUT"
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Building $platforms, push=$push, tags=$tags"

      - if: contains(steps.meta.outputs.platforms, 'arm64')
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ steps.meta.outputs.host }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ steps.meta.outputs.platforms }}
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
